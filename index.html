<title>Šahovnica</title>
<meta name="description" content="Šahovnica — rotes und weißes Schachbrett. Gegen den Computer oder zu zweit am selben Gerät.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #110e0b;
  --fg: #f6f1e7;
  --red: #c4173a;
  --red-deep: #8d1528;
  --brass: #c6a15b;
  --line: #3c3228;
  --ivory: #f4efe4;
  --square: #c4233c;
  --ebony: #1a140f;
  --display: "Cormorant Garamond", Palatino, "Palatino Linotype", Georgia, serif;
  --sans: Outfit, "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(198, 161, 91, 0.08), transparent 55%),
    var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  line-height: 1.45;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.4; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 2px;
}
.app {
  min-height: 100svh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
.home {
  max-width: 28rem;
  margin: 0 auto;
  padding: 2rem 1.25rem 2.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.35rem;
}
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
.shield {
  border: 1px solid var(--brass);
  padding: 4px;
  width: 74px;
  height: 74px;
}
.shield i {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  height: 100%;
}
.shield b { display: block; }
.shield b.on { background: var(--red); }
.shield b.off { background: var(--fg); }
.kicker {
  margin: 0;
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--brass);
}
h1, h2 { font-family: var(--display); font-weight: 500; margin: 0; }
.hero h1 { font-size: 3.4rem; line-height: 0.9; letter-spacing: -0.02em; }
.lede { margin: 0.35rem 0 0; color: color-mix(in srgb, var(--fg) 72%, transparent); font-size: 0.95rem; }
.panel {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--fg) 4%, transparent);
  border-radius: 1.25rem;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}
.panel h2 { font-size: 1.7rem; line-height: 1; }
.row-title { display: flex; align-items: center; gap: 0.5rem; }
.hint { margin: 0; font-size: 0.9rem; color: color-mix(in srgb, var(--fg) 70%, transparent); }
.seg { display: flex; gap: 0.5rem; }
.seg button, .btn {
  min-height: 3rem;
  border-radius: 0.85rem;
  border: 1px solid transparent;
  background: transparent;
}
.seg button { flex: 1; border-color: var(--line); }
.seg button[data-on="w"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg button[data-on="r"] { background: var(--red); color: var(--fg); border-color: var(--red); }
.seg button[data-on="1"] {
  background: color-mix(in srgb, var(--brass) 16%, transparent);
  color: var(--brass);
  border-color: var(--brass);
}
.btn { display: flex; align-items: center; justify-content: center; gap: 0.45rem; padding: 0.65rem 1rem; font-weight: 500; }
.btn:active:not(:disabled) { transform: scale(0.985); }
.btn-primary { width: 100%; background: var(--red); color: var(--fg); }
.btn-line { width: 100%; border-color: var(--line); }
.btn-brass { width: 100%; color: var(--brass); border-color: color-mix(in srgb, var(--brass) 55%, transparent); }
.fine { margin: 0; text-align: center; font-size: 0.78rem; color: color-mix(in srgb, var(--fg) 48%, transparent); }

.play {
  height: 100svh;
  max-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) 0.45rem calc(0.35rem + env(safe-area-inset-bottom));
  max-width: 860px;
  margin: 0 auto;
  overflow: hidden;
}
.top {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  min-height: 3rem;
}
.top .mid { flex: 1; min-width: 0; text-align: center; }
.top h1 { font-size: 1.7rem; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon {
  width: 2.75rem;
  height: 2.75rem;
  border: 0;
  background: transparent;
  border-radius: 0.75rem;
  display: grid;
  place-items: center;
  color: var(--fg);
}
.status {
  text-align: center;
  min-height: 1.6rem;
  font-size: 0.95rem;
}
.status em { font-style: normal; color: var(--brass); }
.moves {
  min-height: 1.4rem;
  overflow-x: auto;
  white-space: nowrap;
  text-align: center;
  font-size: 0.82rem;
  letter-spacing: 0.01em;
  color: color-mix(in srgb, var(--fg) 62%, transparent);
  scrollbar-width: none;
}
.moves::-webkit-scrollbar { display: none; }
.stage {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 0.35rem 0 0.5rem;
}
.frame {
  width: min(100%, calc(100svh - 13.6rem), 680px);
  padding: 0.5rem 0.5rem 0.32rem;
  border-radius: 1.05rem;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 7px),
    linear-gradient(160deg, #3a2c20, #1a140f 42%, #0c0a08);
  box-shadow:
    inset 0 0 0 1px var(--brass),
    0 18px 40px rgba(0, 0, 0, 0.45);
}
.board-wrap {
  display: grid;
  grid-template-columns: 0.9rem 1fr;
  grid-template-rows: 1fr 0.9rem;
  gap: 0.15rem;
}
.squares {
  grid-column: 2;
  grid-row: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  aspect-ratio: 1;
  border: 0.45rem solid var(--ebony);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brass) 70%, transparent);
  touch-action: none;
  user-select: none;
  position: relative;
}
.sq {
  position: relative;
  border: 0;
  padding: 0;
  display: grid;
  place-items: center;
  background: var(--ivory);
}
.sq.dark { background: var(--square); }
.sq.last::after, .sq.sel::after, .sq.check::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.sq.last::after { background: rgba(198, 161, 91, 0.38); }
.sq.sel::after { box-shadow: inset 0 0 0 3px var(--brass); }
.sq.check::after { background: rgba(20, 0, 0, 0.28); box-shadow: inset 0 0 0 3px #fff6ea; }
.mark {
  position: absolute;
  width: 22%;
  height: 22%;
  border-radius: 50%;
  background: rgba(17, 14, 11, 0.28);
  pointer-events: none;
  z-index: 2;
}
.sq.dark .mark { background: rgba(246, 241, 231, 0.55); }
.mark.cap {
  width: 84%;
  height: 84%;
  background: transparent;
  border: 3px solid rgba(17, 14, 11, 0.45);
}
.sq.dark .mark.cap { border-color: rgba(246, 241, 231, 0.8); }
.pc {
  width: 90%;
  height: 90%;
  z-index: 1;
  pointer-events: none;
}
.pc.w path, .pc.w circle, .pc.w ellipse, .pc.w rect {
  fill: #fbf6ec;
  stroke: #1a100c;
  stroke-width: 1.65;
  stroke-linejoin: round;
  stroke-linecap: round;
  paint-order: stroke fill;
}
.pc.r path, .pc.r circle, .pc.r ellipse, .pc.r rect {
  fill: #c4173a;
  stroke: #fff8ee;
  stroke-width: 1.8;
  stroke-linejoin: round;
  stroke-linecap: round;
  paint-order: stroke fill;
}
.pc .eye { fill: #1a100c; stroke: #fff8ee; stroke-width: 0.35; }
.sq.light .pc.w { filter: drop-shadow(0 1px 0 rgba(90, 30, 24, 0.55)); }
.sq.dark .pc.r { filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.35)); }
.pc.fly { transition: transform 0.34s cubic-bezier(0.2, 0.7, 0.2, 1); }
.ranks, .files {
  display: grid;
  color: var(--brass);
  font-size: 0.62rem;
  letter-spacing: 0.04em;
}
.ranks { grid-column: 1; grid-row: 1; grid-template-rows: repeat(8, 1fr); }
.files { grid-column: 2; grid-row: 2; grid-template-columns: repeat(8, 1fr); }
.ranks span, .files span { display: grid; place-items: center; }
.tools {
  display: flex;
  gap: 0.35rem;
  padding-bottom: 0.35rem;
}
.tool {
  flex: 1;
  min-height: 3.1rem;
  border: 0;
  background: transparent;
  border-radius: 0.75rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.1rem;
  font-size: 0.68rem;
  letter-spacing: 0.03em;
}
.tool svg { width: 1.15rem; height: 1.15rem; }
.sheet-back {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 1rem;
  padding-bottom: calc(1rem + env(safe-area-inset-bottom));
}
.sheet {
  width: min(100%, 28rem);
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--fg) 8%, var(--bg));
  border-radius: 1.25rem;
  padding: 1.15rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.sheet h2 { font-size: 2rem; }
.promo-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
.promo-row button {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 0.9rem;
  min-height: 4.6rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.15rem;
  font-size: 0.75rem;
}
.promo-row .pc { width: 2.4rem; height: 2.4rem; }
.veil {
  position: absolute;
  inset: 0;
  z-index: 5;
  border: 0;
  background: rgba(17, 14, 11, 0.94);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
}
.veil strong { font-family: var(--display); font-size: 2rem; font-weight: 500; }
.veil span { color: var(--brass); letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; }
.ghost {
  position: fixed;
  z-index: 40;
  pointer-events: none;
  transform: translate(-50%, -58%);
  filter: drop-shadow(0 8px 8px rgba(0,0,0,.4));
}
@media (prefers-reduced-motion: reduce) {
  .pc.fly { transition: none; }
  .btn:active:not(:disabled) { transform: none; }
}

</style>

<main class="home">
<header class="hero"><h1>Šahovnica</h1><p class="lede">Rotes und weißes Brett. Tippe auf Partie beginnen.</p></header>
</main>
</div>

    const from = S.selected && !dragged ? S.selected : dragged ? start : null;
    if (from) {
      const options = S.chess.moves({ square: from, verbose: true }).filter((move) => move.to === target);
      if (options.length) {
        if (options.some((move) => move.promotion)) {
          S.promo = { from, to: target };
          S.selected = null;
          render();
          return;
        }
        commit(from, target);
        return;
      }
    }
    const piece = S.chess.get(target);
    if (piece && piece.color === turn) {
      S.selected = S.selected === target ? null : target;
      render();
      return;
    }
    S.selected = null;
    render();
  }

  function shield() {
    let cells = "";
    for (let i = 0; i < 25; i += 1) {
      const red = (Math.floor(i / 5) + (i % 5)) % 2 === 0;
      cells += `<b class="${red ? "on" : "off"}"></b>`;
    }
    return `<div class="shield" aria-hidden="true"><i>${cells}</i></div>`;
  }

  function moveLine() {
    if (!S.sans.length) return "";
    const bits = [];
    for (let i = 0; i < S.sans.length; i += 2) {
      const n = i / 2 + 1;
      const w = sanDe(S.sans[i]);
      const b = S.sans[i + 1] ? ` ${sanDe(S.sans[i + 1])}` : "";
      bits.push(`${n}. ${w}${b}`);
    }
    return bits.join("  ");
  }

  function boardHtml() {
    const chess = S.chess;
    const turn = chess.turn();
    const legal = new Map();
    if (S.selected && interactive()) {
      for (const move of chess.moves({ square: S.selected, verbose: true })) {
        legal.set(move.to, Boolean(move.captured || move.isCapture?.()));
      }
    }
    const checkSq =
      !S.result && chess.isCheck()
        ? [...FILES].flatMap((file) => [1, 2, 3, 4, 5, 6, 7, 8].map((rank) => `${file}${rank}`)).find((sq) => {
            const piece = chess.get(sq);
            return piece && piece.type === "k" && piece.color === turn;
          })
        : null;
    const animBySq = new Map(S.anims.map((anim) => [anim.sq, anim.from]));
    let squares = "";
    const ranks = S.orient === "w" ? [8, 7, 6, 5, 4, 3, 2, 1] : [1, 2, 3, 4, 5, 6, 7, 8];
    const files = S.orient === "w" ? [...FILES] : [...FILES].reverse();
    for (const rank of ranks) {
      for (const file of files) {
        const sq = `${file}${rank}`;
        const dark = (file.charCodeAt(0) - 97 + rank) % 2 === 1;
        const piece = chess.get(sq);
        const classes = ["sq", dark ? "dark" : "light"];
        if (S.last && (S.last.from === sq || S.last.to === sq)) classes.push("last");
        if (S.selected === sq) classes.push("sel");
        if (checkSq === sq) classes.push("check");
        let inner = "";
        if (legal.has(sq)) inner += `<i class="mark${legal.get(sq) ? " cap" : ""}"></i>`;
        if (piece) {
          const from = animBySq.get(sq);
          let style = "";
          let fly = "";
          if (from) {
            const a = vis(from);
            const b = vis(sq);
            style = ` style="transform:translate(${(a.file - b.file) * 100}%, ${(a.rank - b.rank) * 100}%)"`;
            fly = " data-fly";
          }
          const name = { p: "Bauer", n: "Springer", b: "Läufer", r: "Turm", q: "Dame", k: "König" }[piece.type];
          inner += `<span class="fig"${fly}${style} aria-label="${sideName(piece.color)} ${name}">${pieceSvg(piece.type, piece.color)}</span>`;
        }

  }

  function onClick(event) {
    const actEl = event.target.closest("[data-act]");
    if (!actEl) return;
    const act = actEl.dataset.act;
    unlockAudio();
    if (act === "color") {
      S.human = actEl.dataset.value === "b" ? "b" : "w";
      render();
      return;
    }
    if (act === "level") {
      S.level = actEl.dataset.value;
      render();
      return;
    }
    if (act === "start-ai") return start("ai");
    if (act === "start-zwei") return start("zwei");
    if (act === "resume") return resume();
    if (act === "mute") {
      S.muted = !S.muted;
      if (master && audioCtx) master.gain.setTargetAtTime(S.muted ? 0 : 0.22, audioCtx.currentTime, 0.02);
      try {
        localStorage.setItem(MUTE, S.muted ? "1" : "0");
      } catch {
        /* ignore */
      }
      render();
      return;
    }
    if (act === "back") {
      if (S.result || S.sans.length === 0) {
        thinkGen += 1;
        S.screen = "home";
        S.canResume = Boolean(readSave());
        render();
      } else S.sheet = "leave";
      render();
      return;
    }
    if (act === "home") {
      thinkGen += 1;
      S.screen = "home";
      S.sheet = null;
      S.canResume = Boolean(readSave());
      render();
      return;
    }
    if (act === "cancel") {
      S.sheet = null;
      S.promo = null;
      render();
      return;
    }
    if (act === "resign") {
      S.sheet = "resign";
      render();
      return;
    }
    if (act === "confirm-resign") return resign();
    if (act === "undo") return undo();
    if (act === "draw") return offerDraw();
    if (act === "reset") return reset();
    if (act === "veil") {
      S.veil = false;
      render();
      return;
    }
    if (act === "promo" && S.promo) {
      const { from, to } = S.promo;
      commit(from, to, actEl.dataset.value);
    }
  }

      const piece = S.chess.get(drag.sq);
      if (piece && piece.color === S.chess.turn()) ghostAt(event.clientX, event.clientY, drag.sq);

  }
  function onPointerUp(event) {

    if (moved) {

  const M = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };

    q: [-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
  };
  const KING_MG = [-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20];
  const KING_EG = [-50,-40,-30,-20,-20,-30,-40,-50,-30,-20,-10,0,0,-10,-20,-30,-30,-10,20,30,30,20,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,20,30,30,20,-10,-30,-30,-30,0,0,0,0,-30,-30,-50,-30,-30,-30,-30,-30,-30,-50];
  const BOOK = {
    "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w": ["e2e4", "d2d4", "g1f3"],

    "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w": ["g1f3", "f1c4"],

    "rnbqkbnr/pppp1ppp/4p3/8/4P3/8/PPPP1PPP/RNBQKBNR w": ["d2d4"],

  const LEVELS = {

  class TimeUp extends Error {}
  function promoOf(value) {
    return value === "q" || value === "r" || value === "b" || value === "n" ? value : undefined;
  }
  function orderMoves(moves) {
    moves.sort((a, b) => rankMove(b) - rankMove(a));
  }
  function rankMove(move) {
    let score = 0;
    if (move.captured) score += 10 * M[move.captured] - M[move.piece];
    if (move.promotion === "q") score += 800;
    else if (move.promotion) score += 400;
    return score;
  }
  function chooseMove(fen, level) {
    const chess = new Chess();
    try {
      chess.load(fen);
    } catch {
      return null;
    }
    const rootMoves = chess.moves({ verbose: true });
    if (!rootMoves.length) return null;
    if (rootMoves.length === 1) {
      const only = rootMoves[0];
      return { from: only.from, to: only.to, promotion: promoOf(only.promotion) };
    }
    const parts = chess.fen().split(" ");
    const book = BOOK[`${parts[0]} ${parts[1]}`];
    if (book) {
      const legal = new Set(rootMoves.map((move) => move.from + move.to));
      const pool = book.filter((uci) => legal.has(uci));
      if (pool.length) {
        const pick = pool[Math.floor(Math.random() * pool.length)];
        return { from: pick.slice(0, 2), to: pick.slice(2, 4) };
      }
    }
    const cfg = LEVELS[level] || LEVELS.mittel;
    function evaluate() {
      const board = chess.board();
      let score = 0;
      let phaseMat = 0;
      let wB = 0;
      let bB = 0;
      let wKing = -1;
      let bKing = -1;
      for (let r = 0; r < 8; r += 1) {
        for (let f = 0; f < 8; f += 1) {
          const piece = board[r][f];
          if (!piece) continue;
          if (piece.type !== "p" && piece.type !== "k") phaseMat += piece.type === "q" ? 9 : piece.type === "r" ? 5 : 3;
          if (piece.type === "b") piece.color === "w" ? (wB += 1) : (bB += 1);
          const idx = piece.color === "w" ? r * 8 + f : (7 - r) * 8 + f;
          if (piece.type === "k") {
            if (piece.color === "w") wKing = idx;
            else bKing = idx;
            continue;
          }
          const val = M[piece.type] + PST[piece.type][idx];
          score += piece.color === "w" ? val : -val;
        }
      }
      const phase = Math.max(0, Math.min(1, phaseMat / 62));
      if (wKing >= 0) score += KING_MG[wKing] * phase + KING_EG[wKing] * (1 - phase);
      if (bKing >= 0) score -= KING_MG[bKing] * phase + KING_EG[bKing] * (1 - phase);
      if (wB >= 2) score += 30;
      if (bB >= 2) score -= 30;
      return chess.turn() === "w" ? score : -score;
    }
    function quiesce(alpha, beta, qdepth, deadline) {
      if (performance.now() > deadline) throw new TimeUp();
      const stand = evaluate();
      if (qdepth <= 0 || stand >= beta) return stand >= beta ? stand : Math.max(stand, alpha);
      let best = stand;
      if (stand > alpha) alpha = stand;
      const moves = chess.moves({ verbose: true }).filter((move) => move.captured || move.promotion);
      orderMoves(moves);
      for (const move of moves) {
        chess.move({ from: move.from, to: move.to, promotion: move.promotion });
        let score = 0;
        try {
          score = -quiesce(-beta, -alpha, qdepth - 1, deadline);
        } finally {
          chess.undo();
        }
        if (score > best) best = score;
        if (score > alpha) alpha = score;
        if (alpha >= beta) break;
      }
      return best;
    }
    function negamax(depth, alpha, beta, ply, deadline) {
      if (performance.now() > deadline) throw new TimeUp();
      if (chess.isDraw()) return 0;
      if (depth === 0) return quiesce(alpha, beta, 2, deadline);
      const moves = chess.moves({ verbose: true });
      if (!moves.length) return chess.isCheck() ? -100000 + ply : 0;
      orderMoves(moves);
      let best = -1000000;
      for (const move of moves) {
        chess.move({ from: move.from, to: move.to, promotion: move.promotion });
        let score = 0;
        try {
          score = -negamax(depth - 1, -beta, -alpha, ply + 1, deadline);
        } finally {
          chess.undo();
        }
        if (score > best) best = score;
        if (score > alpha) alpha = score;
        if (alpha >= beta) break;
      }
      return best;
    }
    function searchRoot(depth, deadline) {
      const moves = chess.moves({ verbose: true });
      orderMoves(moves);
      const scored = [];
      for (const move of moves) {
        chess.move({ from: move.from, to: move.to, promotion: move.promotion });
        let score = 0;
        try {
          score = depth <= 1 ? -evaluate() : -negamax(depth - 1, -1000000, 1000000, 1, deadline);
        } finally {
          chess.undo();
        }
        scored.push({ from: move.from, to: move.to, promotion: promoOf(move.promotion), score });
      }
      return scored;
    }
    let completed = searchRoot(1, Infinity);
    const deadline = performance.now() + cfg.timeMs;
    try {
      for (let depth = 2; depth <= cfg.maxDepth; depth += 1) {
        if (performance.now() > deadline) break;
        completed = searchRoot(depth, deadline);
      }
    } catch (error) {
      if (!(error instanceof TimeUp)) {
        const fallback = rootMoves[0];
        return { from: fallback.from, to: fallback.to, promotion: promoOf(fallback.promotion) };
      }
    }
    completed.sort((a, b) => b.score - a.score);
    const best = completed[0];
    if (!best) return null;
    if (cfg.noise > 0) {
      const pool = completed.filter((move) => move.score >= best.score - cfg.noise);
      const pick = pool[Math.floor(Math.random() * pool.length)] || best;
      return { from: pick.from, to: pick.to, promotion: pick.promotion };
    }
    return { from: best.from, to: best.to, promotion: best.promotion };
  }

  try {
    S.muted = localStorage.getItem(MUTE) === "1";
  } catch {
    S.muted = false;
  }
  S.canResume = Boolean(readSave());
  document.addEventListener("click", onClick);
  document.addEventListener("pointerdown", onPointerDown);
  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", onPointerUp);
  document.addEventListener("pointercancel", () => {
    drag = null;
    clearGhost();
  });
  document.addEventListener("contextmenu", (event) => {
    if (event.target.closest("#board")) event.preventDefault();
  });
  render();
})();

</script>
